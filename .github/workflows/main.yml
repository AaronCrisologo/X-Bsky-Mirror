name: X-Bsky-Mirror Bot
on:
  # Keep manual trigger
  workflow_dispatch:
  # Add this for cron-job.org
  repository_dispatch:
    types: [trigger-my-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install atproto Pillow requests

      - name: Run Bot
        env:
          # Secrets (Settings → Secrets and variables → Secrets)
          BSKY_USER: ${{ secrets.BSKY_USER }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          # Plain config (Settings → Secrets and variables → Variables; code defaults apply if unset)
          TARGET_ACCOUNT: ${{ vars.TARGET_ACCOUNT }}
          MAX_TWEETS: ${{ vars.MAX_TWEETS }}
          FETCH_TIMEOUT: ${{ vars.FETCH_TIMEOUT }}
          SIMULATION_MODE: ${{ vars.SIMULATION_MODE }}
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: 1
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: python bot.py
